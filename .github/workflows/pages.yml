name: Publish Pages manually
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jobradar-production
  cancel-in-progress: false
jobs:
  build:
    if: vars.ENABLE_PAGES_DEPLOY == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m jobradar validate
      - run: python -m unittest discover -s tests -v
      - run: node --check dist/app.mjs && node --check dist/lib.mjs
      - run: node --test tests/frontend.test.mjs
      - run: python -m jobradar build --production
      - run: python scripts/check_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
