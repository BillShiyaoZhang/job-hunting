name: Validate project
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jobradar-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate configuration, data, and inbox
        run: python -m jobradar validate
      - name: Test collection and lifecycle rules
        run: python -m unittest discover -s tests -v
      - name: Check frontend syntax and filtering
        run: |
          node --check dist/app.mjs
          node --check dist/lib.mjs
          node --test tests/frontend.test.mjs
      - name: Build and verify static files
        run: |
          python -m jobradar build
          python scripts/check_site.py
